services:
  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pipeline:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PREFECT_SERVER_EPHEMERAL_ENABLED: ${PREFECT_SERVER_EPHEMERAL_ENABLED:-true}
      PREFECT_SERVER_ANALYTICS_ENABLED: ${PREFECT_SERVER_ANALYTICS_ENABLED:-false}
      PREFECT_CLOUD_ENABLE_ORCHESTRATION_TELEMETRY: ${PREFECT_CLOUD_ENABLE_ORCHESTRATION_TELEMETRY:-false}
      PREFECT_TELEMETRY_ENABLE_RESOURCE_METRICS: ${PREFECT_TELEMETRY_ENABLE_RESOURCE_METRICS:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/intermediate:/app/data/intermediate
      - ./data/processed:/app/data/processed

volumes:
  postgres_data:
